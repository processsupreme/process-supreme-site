<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="300" fill="#0A0A0A"/>
  
  <!-- PS, we love you - signature style -->
  <!-- This is a stylized path approximating the handwritten signature -->
  <g transform="translate(50, 200) rotate(-5)">
    <!-- The signature rendered as styled text with transform -->
    <text font-family="Brush Script MT, Segoe Script, Bradley Hand, cursive" 
          font-size="90" 
          fill="#722F37"
          font-style="italic">
      <tspan x="0" y="0">PS, we love you</tspan>
    </text>
  </g>
</svg>